<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="1200" height="120" role="img" aria-labelledby="lf-title lf-desc">
  <title id="lf-title">Likhith Sai Padige — Linux, cloud and automation</title>
  <desc id="lf-desc">Thin dark footer band with a fine grid, a small orbital mark and the words Linux, Cloud, Automation.</desc>
  <defs>
    <linearGradient id="lf-bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2B0E19"/>
      <stop offset="0.5" stop-color="#0E0B10"/>
      <stop offset="1" stop-color="#2B0E19"/>
    </linearGradient>
    <linearGradient id="lf-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E8823D" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#E8823D" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#E8823D" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="lf-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F3B37A" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#E8823D" stop-opacity="0"/>
    </radialGradient>
    <pattern id="lf-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#EDE3D4" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <clipPath id="lf-frame">
      <rect width="1200" height="120" rx="16"/>
    </clipPath>
    <path id="lf-route" d="M120 60 H520 M680 60 H1080"/>
  </defs>
  <style>
    .lf-orbit { transform-origin: 600px 60px; animation: lf-spin 40s linear infinite; }
    .lf-flow { stroke-dasharray: 4 12; animation: lf-dash 5s linear infinite; }
    @keyframes lf-spin { to { transform: rotate(360deg); } }
    @keyframes lf-dash { to { stroke-dashoffset: -160; } }
    @media (prefers-reduced-motion: reduce) { .lf-orbit, .lf-flow { animation: none; } }
  </style>
  <g clip-path="url(#lf-frame)">
    <rect width="1200" height="120" fill="url(#lf-bg)"/>
    <rect width="1200" height="120" fill="url(#lf-grid)"/>
    <rect x="120" y="59" width="400" height="1.5" fill="url(#lf-line)"/>
    <rect x="680" y="59" width="400" height="1.5" fill="url(#lf-line)"/>
    <use href="#lf-route" fill="none" stroke="#FFE7CF" stroke-opacity="0.35" stroke-width="1" class="lf-flow"/>
    <g fill="none" stroke-linecap="round">
      <circle cx="600" cy="60" r="26" fill="url(#lf-glow)" stroke="none" opacity="0.6"/>
      <g class="lf-orbit">
        <ellipse cx="600" cy="60" rx="44" ry="16" stroke="#C9665A" stroke-opacity="0.6" transform="rotate(-24 600 60)"/>
        <circle cx="640" cy="44" r="2.5" fill="#E8823D" stroke="none"/>
      </g>
      <rect x="593" y="53" width="14" height="14" rx="2" fill="#0E0B10" stroke="#E8823D" transform="rotate(45 600 60)"/>
    </g>
    <text x="600" y="104" text-anchor="middle" fill="#C9B9A6" font-family="'SF Mono', 'Cascadia Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" letter-spacing="3">LINUX · CLOUD · AUTOMATION</text>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="119" rx="16" fill="none" stroke="#3A1A24"/>
</svg>
